# Kaggle T4 run: regenerate a 27-image baseline subset (3 per category) so the EWO (#1) and region (#2)
# analyses can run without the L4 host's images. ~860 edits, ~2 h on a T4. Disjoint from the stage-2 ids
# only by chance; it is a preliminary run, not a replacement for stage 2.
name: kaggle27
seed: 42
output_dir: experiments
dataset:
  name: pie_bench_pp
  subsets: null
  per_subset: 3
  max_images: 27
  rounds: 4
watermarks:
  - {name: none}
  - {name: wam}
  - {name: trustmark}
  - {name: dwtdct, mode: dwtDctSvd}
editors:
  - {name: ip2p, steps: 50, text_cfg: 7.5, image_cfg: 1.5}
  - {name: sdedit, steps: 50, strength: 0.5, cfg: 7.5}
  - {name: turboedit, steps: 4, w: 1.5}   # few-step EF inversion; input carried through every step
methods:
  - {name: baseline}
evaluation:
  target_fpr: 1.0e-3
  image_metrics: true
