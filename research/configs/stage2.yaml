# Stage 2: 90-image sequential benchmark (baselines + re-embed control).
name: stage2
seed: 42
output_dir: experiments
dataset:
  name: pie_bench_pp
  subsets: null        # categories 1-9 (0_random mixes several edit types and is excluded)
  per_subset: 10
  max_images: 90       # 10 per category x 9 categories
  rounds: 4
watermarks:
  - {name: none}       # B0 / FPR control track
  - {name: wam}
  - {name: trustmark}
  - {name: dwtdct, mode: dwtDctSvd}   # dwtDct mode: only 52% detected pre-edit (see notes)
editors:
  - {name: ip2p, steps: 50, text_cfg: 7.5, image_cfg: 1.5}
  - {name: sdedit, steps: 50, strength: 0.5, cfg: 7.5}
  - {name: flux2klein, steps: 4, guidance: 1.0}     # FLUX.2 [klein] 4B (2026), modern editor
methods:
  - {name: baseline}
  - {name: reembed}
evaluation:
  target_fpr: 1.0e-3
  image_metrics: true
