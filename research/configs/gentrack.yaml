# Generated-image track: generation-time watermarks (Tree-Ring, Gaussian Shading) need images generated by the
# watermarking diffusion model, so originals here are SD-1.5 generations of the PIE-Bench++ source captions.
# Re-embed / guided methods do not apply (the watermark lives in the generation noise).
name: gentrack
seed: 42
output_dir: experiments
dataset:
  name: pie_bench_pp
  source: generated
  subsets: null
  per_subset: 5
  max_images: 45
  rounds: 4
watermarks:
  - {name: none}
  - {name: treering}
  - {name: gaussianshading}
editors:
  - {name: ip2p, steps: 50, text_cfg: 7.5, image_cfg: 1.5}
  - {name: sdedit, steps: 50, strength: 0.5, cfg: 7.5}
methods:
  - {name: baseline}
evaluation:
  target_fpr: 1.0e-3
  image_metrics: true
